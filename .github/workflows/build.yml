name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build and unit/scenario tests, including the reference addon (examples/fountain) built against the public
      # APIs only; dependency rules; japicmp against api/baseline/; Javadoc of the public APIs.
      - name: Build and test
        run: ./gradlew build checkDependencyRules apiCompatibility :sim-api:javadoc :mod-api:javadoc

      # In-game tests, including the reference addon; then the KubeJS scripting tests, with KubeJS installed.
      - name: GameTests
        run: ./gradlew :neoforge:runGameTestServer

      - name: KubeJS GameTests
        run: ./gradlew :neoforge:runGameTestServer -PvsKubeJS=true
