plugins {
    // Declared once here so every Minecraft-side project (mod-api, neoforge, compat, examples) shares it.
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

// Root build: shared configuration for the Minecraft-free simulation projects, and the dependency-rule check
// from docs/ARCHITECTURE.md §4.

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Versions shared by the sim projects. They match what Minecraft 1.21.1 ships, so the mod never bundles them.
ext {
    dfuVersion = '8.0.16'
    gsonVersion = '2.10.1'
    fastutilVersion = '8.5.12'
    slf4jVersion = '2.0.9'
    sqliteVersion = '3.46.1.3'
    junitVersion = '5.11.4'
    annotationsVersion = '24.1.0'
}

def simProjects = ['sim-api', 'sim-core', 'sim-content', 'sim-harness', 'sim-bench']

subprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven { url 'https://libraries.minecraft.net' }
    }

    if (name in simProjects) {
        apply plugin: 'java-library'
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)

        dependencies {
            testImplementation platform("org.junit:junit-bom:${junitVersion}")
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
            testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
        }
        tasks.named('test') { useJUnitPlatform() }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    // Javadoc for the public APIs: real errors fail the build; missing comments on record parts don't.
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

// Which projects each project may depend on (main code only; tests may use more).
def allowedDependencies = [
        'sim-api'    : [],
        'sim-core'   : [':sim-api'],
        'sim-content': [':sim-api'],
        'sim-harness': [':sim-api', ':sim-core', ':sim-content'],
        'sim-bench'  : [':sim-api', ':sim-core', ':sim-content', ':sim-harness'],
        'mod-api'    : [':sim-api'],
        'neoforge'   : [':sim-api', ':sim-core', ':sim-content', ':sim-harness', ':mod-api', ':compat:kubejs'],
        'kubejs'     : [':sim-api', ':mod-api'],
        // The reference addon may only use the public APIs (docs/ARCHITECTURE.md �11).
        'fountain'   : [':sim-api', ':mod-api'],
]

// Collected at configuration time so the task stays configuration-cache friendly.
List<String> dependencyViolations = []
gradle.projectsEvaluated {
    subprojects.each { p ->
        def allowed = allowedDependencies[p.name] ?: []
        ['api', 'implementation', 'compileOnly', 'runtimeOnly'].each { cfgName ->
            def cfg = p.configurations.findByName(cfgName)
            cfg?.dependencies?.withType(ProjectDependency)?.each { d ->
                if (!(d.path in allowed)) dependencyViolations << "${p.path} -> ${d.path} (${cfgName})".toString()
            }
        }
    }
}

tasks.register('checkDependencyRules') {
    group = 'verification'
    description = 'Fails if a project depends on a project that docs/ARCHITECTURE.md §4 does not allow.'
    def list = dependencyViolations
    doLast {
        if (!list.isEmpty()) {
            throw new GradleException("Dependency rules violated (docs/ARCHITECTURE.md §4):\n  " + list.join('\n  '))
        }
        logger.lifecycle('Dependency rules OK')
    }
}

// ---------------------------------------------------------------------------------------------- API compatibility
// The public APIs (sim-api, mod-api) are compared with the committed baseline in api/baseline/ (docs/ARCHITECTURE.md
// §11). A binary- or source-incompatible change fails `apiCompatibility` unless it's announced by updating the
// baseline in the same change: `./gradlew updateApiBaseline`. Types marked @ApiStatus.Internal are exempt.
repositories { mavenCentral() }
configurations { japicmp }
dependencies { japicmp('com.github.siom79.japicmp:japicmp:0.26.2:jar-with-dependencies') { transitive = false } }

def publicApis = ['sim-api', 'mod-api']
def apiJar = { String name -> file("${name}/build/libs/${name}-${mod_version}.jar") }
def apiCheckTasks = publicApis.collect { name ->
    tasks.register("apiCompatibility-${name}", JavaExec) {
        group = 'verification'
        description = "Checks ${name} against api/baseline/${name}.jar with japicmp."
        dependsOn ":${name}:jar"
        classpath = configurations.japicmp
        mainClass = 'japicmp.JApiCmp'
        def baseline = file("api/baseline/${name}.jar")
        def current = apiJar(name)
        def report = layout.buildDirectory.file("reports/japicmp/${name}.html")
        inputs.file(baseline)
        inputs.file(current)
        outputs.file(report)
        argumentProviders.add({ ['--old', baseline.path, '--new', current.path,
                                 '--only-incompatible', '--ignore-missing-classes',
                                 '--error-on-binary-incompatibility', '--error-on-source-incompatibility',
                                 '--exclude', '@org.jetbrains.annotations.ApiStatus$Internal',
                                 '--html-file', report.get().asFile.path] } as CommandLineArgumentProvider)
    }
}
tasks.register('apiCompatibility') {
    group = 'verification'
    description = 'Fails on unannounced breaking changes to the public APIs (japicmp against api/baseline/).'
    dependsOn apiCheckTasks
}
tasks.register('updateApiBaseline', Copy) {
    group = 'verification'
    description = 'Announces the current public APIs as the new baseline (commit api/baseline/ with the change).'
    publicApis.each { name ->
        dependsOn ":${name}:jar"
        from(apiJar(name)) { rename { "${name}.jar" } }
    }
    into 'api/baseline'
}
